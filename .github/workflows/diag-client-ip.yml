name: diag-erros-app

# Diagnóstico descartável: quais erros o app está devolvendo (status e assinatura da mensagem),
# agregados e sem dado de ninguém (e-mail e IP são removidos antes de imprimir).

on:
  push:
    branches: [chore/diag-client-ip]

jobs:
  erros:
    runs-on: ubuntu-latest
    steps:
      - name: Erros por status e assinatura
        env:
          PB: ${{ secrets.PORTAINER_BASE_URL }}
          KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, collections

          pb = os.environ["PB"].rstrip("/")
          key = os.environ["KEY"]

          def get(caminho):
              req = urllib.request.Request(f"{pb}{caminho}", headers={"X-API-Key": key})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          EMAIL = re.compile(r"[\w.+-]+@[\w-]+\.[\w.]+")
          IP = re.compile(r"\b\d{1,3}(\.\d{1,3}){3}\b")

          def limpa(texto):
              texto = EMAIL.sub("<email>", texto)
              texto = IP.sub("<ip>", texto)
              return texto[:110]

          for endpoint, container, rotulo in [
              ("8", "enois-qa-backend", "QA"),
              ("11", "enois-prod-backend", "PROD"),
          ]:
              print(f"===== {rotulo} =====")
              try:
                  bruto = get(f"/api/endpoints/{endpoint}/docker/containers/{container}/logs?stdout=1&stderr=1&tail=1500")
              except Exception as erro:
                  print("  nao consegui ler o log:", type(erro).__name__)
                  continue
              texto = bruto.decode("utf-8", "replace")
              status = collections.Counter()
              assinaturas = collections.Counter()
              for linha in texto.splitlines():
                  inicio = linha.find("{")
                  if inicio < 0:
                      continue
                  try:
                      evento = json.loads(linha[inicio:])
                  except Exception:
                      continue
                  if evento.get("log.level") not in ("ERROR", "WARN"):
                      continue
                  codigo = (evento.get("http") or {}).get("response", {}).get("status_code")
                  if codigo:
                      status[codigo] += 1
                  mensagem = limpa(str(evento.get("message", "")))
                  if mensagem:
                      assinaturas[mensagem] += 1
              print("  erros/avisos por status:", dict(status.most_common(8)) or "nenhum")
              print("  assinaturas mais frequentes:")
              for msg, n in assinaturas.most_common(6):
                  print(f"    {n:>4}x {msg}")
              print()
          PY
