name: diag-client-ip
on:
  push:
    branches: [chore/diag-client-ip]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Status das respostas no log do container (agregado)
        env:
          PB: ${{ secrets.PORTAINER_BASE_URL }}
          KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, collections
          pb = os.environ["PB"].rstrip("/"); key = os.environ["KEY"]
          for endpoint, container, rotulo in [("8","enois-qa-backend","QA"),("11","enois-prod-backend","PROD")]:
              url = f"{pb}/api/endpoints/{endpoint}/docker/containers/{container}/logs?stdout=1&stderr=1&tail=3000"
              req = urllib.request.Request(url, headers={"X-API-Key": key})
              try:
                  texto = urllib.request.urlopen(req, timeout=90).read().decode("utf-8","replace")
              except Exception as e:
                  print(f"===== {rotulo} =====\n  nao consegui ler o log: {type(e).__name__}\n"); continue
              status = collections.Counter()
              for m in re.finditer(r'"statusCode":(\d{3})|"status":(\d{3})', texto):
                  status[m.group(1) or m.group(2)] += 1
              print(f"===== {rotulo} =====")
              print("  status:", dict(sorted(status.items())[:14]))
              print("  ERROR:", len(re.findall(r'"level":"ERROR"', texto)), "| WARN:", len(re.findall(r'"level":"WARN"', texto)))
              print()
          PY
